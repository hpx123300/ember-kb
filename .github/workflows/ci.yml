name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      # 评测要真调模型，CI 里没有 key，只在本地跑：python scripts/eval_qa.py --save
      # CI 守的是「结构没坏」：导入正常、知识库可加载、接口路由齐全。
      - name: Smoke check (imports + knowledge base)
        run: |
          python -c "import sys; sys.path.insert(0,'.')
          from backend.app.agent.rag import knowledge_base
          from backend.app import training
          import server.main
          knowledge_base.load()
          assert len(training.list_chapters()) >= 8
          print('chapters:', len(training.list_chapters()), 'chunks:', len(knowledge_base.chunks))"
          

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: web
        run: npm install
      - name: TypeScript check + Vite build
        working-directory: web
        run: npm run build
